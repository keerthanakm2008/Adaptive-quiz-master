<!DOCTYPE html>
<html>
<head>
    <title>Adaptive Quiz Master</title>

    <style>
        body {
            font-family: Arial;
            background: linear-gradient(135deg, #667eea, #764ba2);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .box {
            background: white;
            padding: 40px;
            width: 400px;
            text-align: center;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        input {
            padding: 12px;
            width: 90%;
            margin: 15px 0;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        button {
            padding: 12px 30px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background: #4c51bf;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>Adaptive Quiz Master</h1>

    <p>Welcome to the Quiz!</p>

    <form method="POST">

        <input
            type="text"
            name="name"
            placeholder="Enter your name"
            required
        >

        <br>

        <button type="submit">
            Start Quiz
        </button>

    </form>

</div>

</body>
</html>
